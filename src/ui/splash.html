<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MuktoDwar</title>
<style>
  body { margin:0; background:#0B0F14; color:#E6EAF2; font-family:system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; }
  .mark { width:96px; height:96px; margin-bottom:16px; }
  .title { font-size:22px; font-weight:700; letter-spacing:.5px; }
  .sub { margin-top:8px; color:#9AA4B2; font-size:13px; }
  .spin { margin-top:24px; width:28px; height:28px; border:3px solid #2A2F3A; border-top-color:#7C3AED; border-radius:50%; animation:rot 1s linear infinite; }
  @keyframes rot { to { transform:rotate(360deg); } }
</style>
</head>
<body>
  <img class="mark" src="muktodwar-mark.svg" alt="" />
  <div class="title">MuktoDwar</div>
  <div class="sub">Starting local gateway…</div>
  <div class="spin"></div>
</body>
</html>
