<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 260" width="650" height="260" role="img" aria-labelledby="title desc"><title id="title">MuktoDwar animated loading logo</title><desc id="desc">MuktoDwar neon open gateway logo with connected AI routing nodes.</desc><defs><linearGradient id="motion-edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A855F7"/><stop offset=".55" stop-color="#7C3AED"/><stop offset="1" stop-color="#3882F6"/></linearGradient><linearGradient id="motion-door" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A855F7"/><stop offset=".48" stop-color="#3882F6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient><linearGradient id="motion-word" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#A855F7"/><stop offset=".55" stop-color="#3882F6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient><radialGradient id="motion-halo"><stop stop-color="#3882F6" stop-opacity=".42"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient><filter id="motion-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>.door{transform-origin:120px 118px;animation:door 2.5s ease-in-out infinite}.route{stroke-dasharray:90;stroke-dashoffset:90;animation:route 2.5s ease-in-out infinite}.node{opacity:0;animation:nodes 2.5s ease-in-out infinite}.name{opacity:0;animation:name 2.5s ease-in-out infinite}@keyframes door{0%,8%{opacity:0;transform:translateX(-12px)}26%,100%{opacity:1;transform:none}}@keyframes route{0%,25%{stroke-dashoffset:90;opacity:0}56%,100%{stroke-dashoffset:0;opacity:1}}@keyframes nodes{0%,45%{opacity:0}64%,100%{opacity:1}}@keyframes name{0%,67%{opacity:0}82%,100%{opacity:1}}@media (prefers-reduced-motion:reduce){.door,.route,.node,.name{animation:none;opacity:1;stroke-dashoffset:0}}</style><g class="door" filter="url(#motion-glow)"><path d="M52 63 144 12v171L52 226z" fill="url(#motion-edge)"/><path d="M64 70 130 34v132l-66 36z" fill="#0B0F14" stroke="url(#motion-door)" stroke-width="6"/><path d="M130 34 144 12v171l-14-17z" fill="url(#motion-door)"/></g><g class="route" fill="none" stroke-linecap="round" stroke-width="3"><path d="M144 54C177 55 185 68 202 76" stroke="#22D3EE"/><path d="M143 82c27 9 35 31 59 38" stroke="#3882F6"/><path d="M143 111c31 8 37 36 60 50" stroke="#A855F7"/><path d="M143 143c23 15 28 40 48 53" stroke="#3882F6"/></g><g class="node"><circle cx="203" cy="76" r="8" fill="#22D3EE"/><circle cx="202" cy="120" r="8" fill="#3882F6"/><circle cx="203" cy="161" r="8" fill="#A855F7"/><circle cx="191" cy="196" r="7" fill="#3882F6"/></g><g class="name"><text x="246" y="76" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-3">Mukto<tspan fill="#3882F6">Dwar</tspan></text><text x="249" y="123" fill="#9CC5FF" font-family="Arial, sans-serif" font-size="22" letter-spacing="5">YOUR LOCAL GATEWAY TO AI</text></g></svg>
