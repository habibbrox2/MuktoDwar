name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: typecheck + tests + build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Probe DPAPI layers 2 (temporary)
        timeout-minutes: 12
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $ps = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          Set-Content -Path probe-helper.ps1 -Value 'exit 0' -Encoding ASCII
          function Run-Child([string]$scriptArgs, [bool]$fullEnv, [int]$waitMs) {
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $ps
            $psi.Arguments = $scriptArgs
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $psi.RedirectStandardInput = $true
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            if (-not $fullEnv) {
              $psi.EnvironmentVariables.Clear()
              $psi.EnvironmentVariables['SystemRoot'] = $env:SystemRoot
            }
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $p = [Diagnostics.Process]::Start($psi)
            try {
              $p.StandardInput.Write('{"ops":[{"id":"probe","mode":"protect","value":"hello"}]}')
              $p.StandardInput.Close()
            } catch {}
            $o = $p.StandardOutput.ReadToEndAsync()
            $e = $p.StandardError.ReadToEndAsync()
            if ($p.WaitForExit($waitMs)) {
              return "exit=$($p.ExitCode) ms=$($sw.ElapsedMilliseconds) out=[$($o.Result)] err=[$($e.Result)]"
            }
            try { $p.Kill() } catch {}
            return "HUNG ms=$($sw.ElapsedMilliseconds) out=[$($o.Result)] err=[$($e.Result)]"
          }
          Write-Host ("A2 SystemRoot env, pipes, -Command: " + (Run-Child '-NoProfile -NonInteractive -Command "exit 0"' $false 30000))
          Write-Host ("D  full env, pipes, -File dpapi.ps1:   " + (Run-Child '-NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts\dpapi.ps1' $true 60000))
          Write-Host ("H  SystemRoot env, -File helper.ps1:   " + (Run-Child '-NoProfile -NonInteractive -ExecutionPolicy Bypass -File probe-helper.ps1' $false 30000))
          Write-Host ("F  SystemRoot env, -File dpapi.ps1:    " + (Run-Child '-NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts\dpapi.ps1' $false 120000))

      - name: Verify (typecheck + tests + build)
        run: npm run verify
