name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: typecheck + tests + build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck + tests + build)
        run: npm run verify
