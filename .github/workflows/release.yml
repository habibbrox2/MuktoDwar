name: Release Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Provision build-time publisher trust pin
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_SIGNING_CERT_THUMBPRINT: ${{ secrets.WINDOWS_SIGNING_CERT_THUMBPRINT }}
        run: ./scripts/provision-publisher-pin.ps1

      - name: Verify
        run: npm run verify

      - name: Build SEA executable
        run: npm run build:sea

      - name: Assemble app folder
        shell: pwsh
        run: |
          $app = "build/app"
          New-Item -ItemType Directory -Force -Path $app | Out-Null
          Copy-Item "build/muktodwar.exe" $app
          Copy-Item -Recurse "src/ui" "$app/ui"
          Copy-Item -Recurse "assets" "$app/assets"
          Copy-Item -Recurse "scripts" "$app/scripts"
          if (Test-Path "dist") { Copy-Item -Recurse "dist" "$app/dist" }

      - name: Build installer (Inno Setup) and MSI (WiX)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          choco install wixtoolset -y --no-progress
          scripts/build-installers.ps1

      # Signing is optional for test builds, but a release is marked update-safe
      # only when every distributable executable/package has a verified signature.
      - name: Sign distributables and create update integrity manifest
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_SIGNING_CERT_THUMBPRINT: ${{ secrets.WINDOWS_SIGNING_CERT_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'build/muktodwar.exe',
            'build/installer/MuktoDwar-Setup.exe',
            'build/installer/MuktoDwar.msi'
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file -PathType Leaf)) { throw "Missing release file: $file" }
          }

          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)
          $expectedThumbprint = ($env:WINDOWS_SIGNING_CERT_THUMBPRINT -replace '[^0-9A-Fa-f]','').ToUpperInvariant()
          if ($hasPfx -xor $hasPassword) {
            throw 'Both WINDOWS_SIGNING_PFX_BASE64 and WINDOWS_SIGNING_PFX_PASSWORD must be configured together.'
          }

          if ($hasPfx -and -not $expectedThumbprint) {
            throw 'WINDOWS_SIGNING_CERT_THUMBPRINT is required when signing is enabled.'
          }

          $signed = $false
          $publisherThumbprint = $null
          $autoInstallAllowed = $false
          if ($hasPfx) {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'muktodwar-signing.pfx'
            try {
              [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
              $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
                $pfxPath,
                $env:WINDOWS_SIGNING_PFX_PASSWORD,
                [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
              )
              if (-not $cert.HasPrivateKey) { throw 'Signing certificate has no private key.' }
              $publisherThumbprint = $cert.Thumbprint.ToUpperInvariant()
              if ($publisherThumbprint -ne $expectedThumbprint) { throw 'PFX certificate thumbprint does not match the pinned WINDOWS_SIGNING_CERT_THUMBPRINT.' }
              $signtool = (Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin/*/x64/signtool.exe') -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1).FullName
              if (-not $signtool) { throw 'Windows SDK signtool.exe was not found on the runner.' }
              foreach ($file in $files) {
                & $signtool sign /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 /f $pfxPath /p $env:WINDOWS_SIGNING_PFX_PASSWORD $file
                if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed: $file" }
                & $signtool verify /pa /all $file
                if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed: $file" }
              }
              $signed = $true
              $autoInstallAllowed = $true
            }
            finally {
              Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
              Remove-Variable cert -ErrorAction SilentlyContinue
            }
          }

          $entries = @()
          foreach ($file in $files) {
            $item = Get-Item $file
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $signatureStatus = if ($signed) { (Get-AuthenticodeSignature $file).Status.ToString() } else { 'NotSigned' }
            if ($signed -and $signatureStatus -ne 'Valid') { throw "Signature status is not Valid for $file" }
            $entries += [ordered]@{
              name = $item.Name
              path = ($file -replace '\\','/')
              size = $item.Length
              sha256 = $hash
              authenticode = $signatureStatus
            }
          }

          $manifest = [ordered]@{
            schemaVersion = 1
            version = (Get-Content package.json -Raw | ConvertFrom-Json).version
            tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF.Substring(10) } else { $null }
            generatedAt = [DateTime]::UtcNow.ToString('o')
            authenticodeSigned = $signed
            publisherThumbprint = $publisherThumbprint
            automaticInstallationAllowed = $autoInstallAllowed
            files = $entries
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content 'build/installer/update-manifest.json' -Encoding utf8
          $entries | ForEach-Object { "$($_.sha256)  $($_.name)" } | Set-Content 'build/installer/SHA256SUMS.txt' -Encoding ascii
          Write-Host "Integrity manifest created. AuthenticodeSigned=$signed; publisherThumbprint=$publisherThumbprint; automaticInstallationAllowed=$autoInstallAllowed"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: muktodwar-windows-${{ github.run_number }}
          path: |
            build/muktodwar.exe
            build/installer/*.exe
            build/installer/*.msi
            build/installer/update-manifest.json
            build/installer/SHA256SUMS.txt

      # Publish the release and create its version tag from this main-branch build.
      # Unsigned releases remain manually installable; the manifest disables in-app installation.
      - name: Create versioned GitHub Release and tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MuktoDwar ${{ steps.version.outputs.tag }}
          files: |
            build/muktodwar.exe
            build/installer/*.exe
            build/installer/*.msi
            build/installer/update-manifest.json
            build/installer/SHA256SUMS.txt
          generate_release_notes: true
