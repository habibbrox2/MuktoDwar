name: Release Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Build SEA executable
        run: npm run build:sea

      - name: Assemble app folder
        shell: pwsh
        run: |
          $app = "build/app"
          New-Item -ItemType Directory -Force -Path $app | Out-Null
          Copy-Item "build/muktodwar.exe" $app
          Copy-Item -Recurse "src/ui" "$app/ui"
          Copy-Item -Recurse "assets" "$app/assets"
          if (Test-Path "dist") { Copy-Item -Recurse "dist" "$app/dist" }

      - name: Build installer (Inno Setup)
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/muktodwar.iss
        shell: pwsh

      - name: Build MSI (WiX)
        shell: pwsh
        run: |
          choco install wixtoolset -y
          $env:Path = "C:\Program Files (x86)\WiX Toolset v3.11\bin;" + $env:Path
          heat dir build/app -cg ProductComponents -gg -scom -sreg -sfrag -srd -dr INSTALLFOLDER -var var.SourceDir -out installer/harvested.wxs
          New-Item -ItemType Directory -Force -Path build/installer | Out-Null
          candle -dSourceDir=build/app installer/muktodwar.wxs installer/harvested.wxs -out build/
          light build/muktodwar.wixobj build/harvested.wixobj -out build/installer/MuktoDwar.msi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: muktodwar-windows
          path: |
            build/muktodwar.exe
            build/installer/*.exe
            build/installer/*.msi

      - name: Compute release tag
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            "tag=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "tag=build-${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            build/muktodwar.exe
            build/installer/*.exe
            build/installer/*.msi
          generate_release_notes: true