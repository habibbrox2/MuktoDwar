name: Release Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Build SEA executable
        run: npm run build:sea

      - name: Assemble app folder
        shell: pwsh
        run: |
          $app = "build/app"
          New-Item -ItemType Directory -Force -Path $app | Out-Null
          Copy-Item "build/muktodwar.exe" $app
          Copy-Item -Recurse "src/ui" "$app/ui"
          Copy-Item -Recurse "assets" "$app/assets"
          Copy-Item -Recurse "scripts" "$app/scripts"
          if (Test-Path "dist") { Copy-Item -Recurse "dist" "$app/dist" }

      - name: Build installer (Inno Setup) and MSI (WiX)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          choco install wixtoolset -y --no-progress
          scripts/build-installers.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: muktodwar-windows-${{ github.run_number }}
          path: |
            build/muktodwar.exe
            build/installer/*.exe
            build/installer/*.msi

      # A GitHub release is published for a tag only.
      #
      # A push to main still builds the installers, but they stay workflow
      # artifacts. Publishing a release per commit buried the real releases
      # under a pile of build-N entries.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            build/muktodwar.exe
            build/installer/*.exe
            build/installer/*.msi
          generate_release_notes: true