name: Windows Test Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    name: Build Windows Test Packages
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: npm run verify

      - name: Build standalone executable
        run: npm run build:sea

      - name: Assemble application
        shell: pwsh
        run: |
          $app = "build/app"
          New-Item -ItemType Directory -Force -Path $app | Out-Null
          Copy-Item "build/muktodwar.exe" $app
          Copy-Item -Recurse "src/ui" "$app/ui"
          Copy-Item -Recurse "assets" "$app/assets"
          Copy-Item -Recurse "scripts" "$app/scripts"
          if (Test-Path "dist") {
            Copy-Item -Recurse "dist" "$app/dist"
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Install WiX Toolset
        run: choco install wixtoolset -y --no-progress

      - name: Build installers (Inno Setup EXE + WiX MSI)
        shell: pwsh
        run: scripts/build-installers.ps1

      - name: Verify output files
        shell: pwsh
        run: |
          if (-not (Test-Path "build/muktodwar.exe")) {
            throw "Standalone executable was not generated."
          }
          $setup = Get-ChildItem "build/installer" -Filter "*.exe" -ErrorAction SilentlyContinue
          $msi = Get-ChildItem "build/installer" -Filter "*.msi" -ErrorAction SilentlyContinue
          if (-not $setup) {
            throw "The Inno Setup installer was not generated."
          }
          if (-not $msi) {
            throw "The MSI package was not generated."
          }
          $files = @("build/muktodwar.exe") + @($setup.FullName) + @($msi.FullName)
          Get-FileHash $files -Algorithm SHA256

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: muktodwar-windows-test-${{ github.run_number }}
          path: |
            build/muktodwar.exe
            build/installer/*.exe
            build/installer/*.msi
          if-no-files-found: error
          retention-days: 7