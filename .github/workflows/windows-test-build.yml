name: Windows Test Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'installer/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-test-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    name: Build and smoke-test Windows packages
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: npm run verify

      - name: Build standalone executable
        run: npm run build:sea

      - name: Assemble application
        shell: pwsh
        run: |
          $app = "build/app"
          New-Item -ItemType Directory -Force -Path $app | Out-Null
          Copy-Item "build/muktodwar.exe" $app
          Copy-Item -Recurse "src/ui" "$app/ui"
          Copy-Item -Recurse "assets" "$app/assets"
          Copy-Item -Recurse "scripts" "$app/scripts"
          if (Test-Path "dist") {
            Copy-Item -Recurse "dist" "$app/dist"
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Install WiX Toolset
        run: choco install wixtoolset -y --no-progress

      - name: Build installers (Inno Setup EXE + WiX MSI)
        shell: pwsh
        run: scripts/build-installers.ps1

      - name: Smoke-test Inno Setup install, localhost, admin login and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-BoundedProcess {
            param([string]$FilePath, [string[]]$ArgumentList, [int]$TimeoutSeconds, [string]$Label)
            $child = Start-Process -FilePath $FilePath -ArgumentList $ArgumentList -PassThru
            if (-not $child.WaitForExit($TimeoutSeconds * 1000)) {
              try { $child.Kill($true) } catch {}
              try { $child.WaitForExit(10000) | Out-Null } catch {}
              throw "$Label timed out after $TimeoutSeconds seconds."
            }
            $child.Refresh()
            return $child.ExitCode
          }
          $installer = (Resolve-Path "build/installer/MuktoDwar-Setup.exe").Path
          $installDir = Join-Path $env:ProgramFiles "MuktoDwar"
          $appExe = Join-Path $installDir "muktodwar.exe"
          $testRoot = Join-Path $env:RUNNER_TEMP "muktodwar-smoke"
          $env:LOCALAPPDATA = Join-Path $testRoot "LocalAppData"
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA, $testRoot | Out-Null

          $proc = $null
          $oldProc = $null
          $previousAdminToken = $null
          try {
            # Install the previous published version first, then upgrade it
            # in place with the PR build. This exercises the real version
            # transition while keeping the user profile isolated to this job.
            $previousInstaller = Join-Path $testRoot "MuktoDwar-1.1.3-Setup.exe"
            Invoke-WebRequest "https://github.com/habibbrox2/MuktoDwar/releases/download/v1.1.3/MuktoDwar-Setup.exe" -OutFile $previousInstaller -TimeoutSec 120
            $previousExitCode = Invoke-BoundedProcess -FilePath $previousInstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-") -TimeoutSeconds 180 -Label "Previous-version installer"
            if ($previousExitCode -ne 0) { throw "Previous-version installer failed with exit code $previousExitCode." }
            if (-not (Test-Path $appExe)) { throw "Previous-version executable is missing." }

            $oldProc = Start-Process -FilePath $appExe -PassThru
            $base = "http://127.0.0.1:8787"
            $oldHealth = $null
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              try { $oldHealth = Invoke-RestMethod "$base/health" -TimeoutSec 3; break } catch {}
              if ($oldProc.HasExited) { throw "Previous gateway exited during startup (code $($oldProc.ExitCode))." }
            }
            if (-not $oldHealth -or $oldHealth.status -ne "ok") { throw "Previous gateway did not become ready." }
            $previousBootstrap = Invoke-RestMethod "$base/admin/default-token" -TimeoutSec 5
            $previousAdminToken = $previousBootstrap.token
            if (-not $previousAdminToken) { throw "Previous-version admin token was not created." }
            Stop-Process -Id $oldProc.Id -Force
            Wait-Process -Id $oldProc.Id -Timeout 10 -ErrorAction SilentlyContinue
            $oldProc = $null

            $installExitCode = Invoke-BoundedProcess -FilePath $installer -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-") -TimeoutSeconds 180 -Label "Current-version installer"
            if ($installExitCode -ne 0) { throw "Installer failed with exit code $installExitCode." }
            if (-not (Test-Path $appExe)) { throw "Installed executable is missing." }

            $proc = Start-Process -FilePath $appExe -PassThru
            $base = "http://127.0.0.1:8787"
            $health = $null
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              try { $health = Invoke-RestMethod "$base/health" -TimeoutSec 3; break } catch {}
              if ($proc.HasExited) { throw "Gateway process exited during startup (code $($proc.ExitCode))." }
            }
            if (-not $health -or $health.status -ne "ok") { throw "Local health endpoint did not become ready." }

            $bootstrap = Invoke-RestMethod "$base/admin/default-token" -TimeoutSec 5
            if (-not $bootstrap.token) { throw "Admin bootstrap token was not available in the isolated test profile." }
            if ($bootstrap.token -ne $previousAdminToken) { throw "Admin token did not survive the 1.1.3 to current-version upgrade." }
            Write-Host "PASS: upgrade from v1.1.3 preserved the existing DPAPI-backed admin token."

            $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
            $headers = @{ Origin = $base }
            $login = Invoke-RestMethod "$base/admin/session" -Method Post -WebSession $session -Headers $headers -ContentType "application/json" -Body (@{ token = $bootstrap.token } | ConvertTo-Json -Compress) -TimeoutSec 5
            if (-not $login.ok) { throw "Admin session login failed." }
            $settings = Invoke-RestMethod "$base/admin/settings" -WebSession $session -Headers $headers -TimeoutSec 5
            if (-not $settings.localOnly -or $settings.bindHost -ne "127.0.0.1") { throw "Authenticated admin settings did not confirm loopback-only mode." }

            Write-Host "PASS: installer, process startup, localhost health, admin login and authenticated settings."
          }
          finally {
            if ($oldProc -and -not $oldProc.HasExited) {
              Stop-Process -Id $oldProc.Id -Force -ErrorAction SilentlyContinue
              Wait-Process -Id $oldProc.Id -Timeout 10 -ErrorAction SilentlyContinue
            }
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              Wait-Process -Id $proc.Id -Timeout 10 -ErrorAction SilentlyContinue
            }
            $uninstaller = Join-Path $installDir "unins000.exe"
            if (Test-Path $uninstaller) {
              $removeExitCode = Invoke-BoundedProcess -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -TimeoutSeconds 120 -Label "Inno Setup uninstaller"
              if ($removeExitCode -ne 0) { throw "Uninstaller failed with exit code $removeExitCode." }
              if (Test-Path $appExe) { throw "Application executable remains after uninstall." }
              Write-Host "PASS: silent uninstall removed the application."
            }
          }

      - name: Smoke-test WiX MSI install, repair, localhost and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-BoundedProcess {
            param([string]$FilePath, [string[]]$ArgumentList, [int]$TimeoutSeconds, [string]$Label)
            $child = Start-Process -FilePath $FilePath -ArgumentList $ArgumentList -PassThru
            if (-not $child.WaitForExit($TimeoutSeconds * 1000)) {
              try { $child.Kill($true) } catch {}
              try { $child.WaitForExit(10000) | Out-Null } catch {}
              throw "$Label timed out after $TimeoutSeconds seconds."
            }
            $child.Refresh()
            return $child.ExitCode
          }
          $msi = (Resolve-Path "build/installer/MuktoDwar.msi").Path
          $installDir = Join-Path $env:ProgramFiles "MuktoDwar"
          $appExe = Join-Path $installDir "muktodwar.exe"
          $testRoot = Join-Path $env:RUNNER_TEMP "muktodwar-msi-smoke"
          $env:LOCALAPPDATA = Join-Path $testRoot "LocalAppData"
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $installLog = Join-Path $testRoot "msi-install.log"
          $repairLog = Join-Path $testRoot "msi-repair.log"
          $removeLog = Join-Path $testRoot "msi-uninstall.log"
          $proc = $null
          $productCode = $null
          try {
            $installExitCode = Invoke-BoundedProcess -FilePath "msiexec.exe" -ArgumentList @("/i", "`"$msi`"", "/qn", "/norestart", "/l*v", "`"$installLog`"") -TimeoutSeconds 240 -Label "MSI install"
            if ($installExitCode -notin @(0, 3010)) { throw "MSI install failed with exit code $installExitCode. See $installLog." }
            if (-not (Test-Path $appExe)) { throw "MSI did not install the application executable." }

            $entry = Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" |
              Where-Object { $_.DisplayName -eq "MuktoDwar" } |
              Select-Object -First 1
            if (-not $entry) { throw "MSI uninstall registration was not found." }
            $match = [regex]::Match([string]$entry.UninstallString, '\{[0-9A-Fa-f-]{36}\}')
            if (-not $match.Success) { throw "MSI product code could not be read from uninstall registration." }
            $productCode = $match.Value

            $proc = Start-Process -FilePath $appExe -PassThru
            $base = "http://127.0.0.1:8787"
            $health = $null
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              try { $health = Invoke-RestMethod "$base/health" -TimeoutSec 3; break } catch {}
              if ($proc.HasExited) { throw "MSI-installed gateway exited during startup (code $($proc.ExitCode))." }
            }
            if (-not $health -or $health.status -ne "ok") { throw "MSI-installed gateway did not become healthy." }
            $bootstrap = Invoke-RestMethod "$base/admin/default-token" -TimeoutSec 5
            if (-not $bootstrap.token) { throw "MSI-installed admin token was not created." }
            $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
            $headers = @{ Origin = $base }
            $login = Invoke-RestMethod "$base/admin/session" -Method Post -WebSession $session -Headers $headers -ContentType "application/json" -Body (@{ token = $bootstrap.token } | ConvertTo-Json -Compress) -TimeoutSec 5
            if (-not $login.ok) { throw "MSI-installed admin login failed." }
            Write-Host "PASS: MSI install, process startup, localhost health and admin login."

            Stop-Process -Id $proc.Id -Force
            Wait-Process -Id $proc.Id -Timeout 10 -ErrorAction SilentlyContinue
            $proc = $null

            $repairExitCode = Invoke-BoundedProcess -FilePath "msiexec.exe" -ArgumentList @("/fa", $productCode, "/qn", "/norestart", "/l*v", "`"$repairLog`"") -TimeoutSeconds 240 -Label "MSI repair"
            if ($repairExitCode -notin @(0, 3010)) { throw "MSI repair failed with exit code $repairExitCode. See $repairLog." }
            if (-not (Test-Path $appExe)) { throw "MSI repair removed or failed to restore the application executable." }
            Write-Host "PASS: MSI repair completed."

            $removeExitCode = Invoke-BoundedProcess -FilePath "msiexec.exe" -ArgumentList @("/x", $productCode, "/qn", "/norestart", "/l*v", "`"$removeLog`"") -TimeoutSeconds 240 -Label "MSI uninstall"
            if ($removeExitCode -notin @(0, 3010)) { throw "MSI uninstall failed with exit code $removeExitCode. See $removeLog." }
            if (Test-Path $appExe) { throw "Application executable remains after MSI uninstall." }
            $remaining = Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -eq "MuktoDwar" }
            if ($remaining) { throw "MuktoDwar MSI uninstall registration remains after uninstall." }
            Write-Host "PASS: MSI uninstall removed the executable and uninstall registration."
          }
          finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              Wait-Process -Id $proc.Id -Timeout 10 -ErrorAction SilentlyContinue
            }
            if ($productCode -and (Test-Path $appExe)) {
              try { Invoke-BoundedProcess -FilePath "msiexec.exe" -ArgumentList @("/x", $productCode, "/qn", "/norestart") -TimeoutSeconds 120 -Label "MSI cleanup" | Out-Null } catch { Write-Warning $_ }
            }
          }

      - name: Verify output files and SHA-256
        shell: pwsh
        run: |
          if (-not (Test-Path "build/muktodwar.exe")) {
            throw "Standalone executable was not generated."
          }
          $setup = Get-ChildItem "build/installer" -Filter "*.exe" -ErrorAction SilentlyContinue
          $msi = Get-ChildItem "build/installer" -Filter "*.msi" -ErrorAction SilentlyContinue
          if (-not $setup) { throw "The Inno Setup installer was not generated." }
          if (-not $msi) { throw "The MSI package was not generated." }
          $files = @("build/muktodwar.exe") + @($setup.FullName) + @($msi.FullName)
          Get-FileHash $files -Algorithm SHA256

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: muktodwar-windows-test-${{ github.run_number }}
          path: |
            build/muktodwar.exe
            build/installer/*.exe
            build/installer/*.msi
          if-no-files-found: error
          retention-days: 7
